name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default image: Minecraft 1.21.11 client, tags latest / sha-<sha> / <semver>.
          - variant: default
            tags: |
              type=raw,value=latest,enable={{is_default_branch}}
              type=sha
              type=semver,pattern={{version}}
            build-args: ""
          # Minecraft 26.2 client (Java 25) with GeyserMC Rainbow, tags mc26.2 / mc26.2-sha-<sha>.
          - variant: mc26.2
            tags: |
              type=raw,value=mc26.2,enable={{is_default_branch}}
              type=sha,prefix=mc26.2-sha-
            build-args: |
              JAVA_IMAGE=eclipse-temurin:25-jre-jammy
              MC_VERSION=26.2
              FABRIC_LOADER_VERSION=0.19.5
              MCCLI_VERSION=1.6.0-input.3
              MCCLI_FABRIC_JAR=mccli-fabric-26.2-1.6.0-input.3.jar
              MCCLI_FABRIC_JAR_SHA256=abcbd58a797f9e226d4134828ea1c81dc6012dd16b31d03bd95e9b0fdbee4004
              FABRIC_API_FILENAME=fabric-api-0.161.0+26.2.jar
              FABRIC_API_MODRINTH_VERSION=ewUK83HI
              FABRIC_API_JAR_SHA256=e5b858ceb13290c274e31cb888ff5a1a40cb91067e7ffab0b5b775aec51e216a
              EXTRA_MOD_URL=https://download.geysermc.org/v2/projects/rainbow/versions/0.2.1/builds/55/downloads/rainbow
              EXTRA_MOD_FILE=rainbow-0.2.1-26.2-b55.jar
              EXTRA_MOD_SHA256=e1b3ac3c796650e60008025f00744fe46e1175a935ef3e3f1d33eed8e0c6c0f3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR requires a lowercase image path; the owner login may contain caps.
      - name: Lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER@L}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/minecraft-mcp-server
          tags: ${{ matrix.tags }}

      # linux/amd64 only; add linux/arm64 by enabling QEMU + buildx multi-platform.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
